<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Список гостей</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    background:#f8f8f8;
    padding:50px;
}

.card{
    border:none;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

</style>

</head>
<body>

<div class="container">

    <div class="card p-4">

        <h2 class="mb-4">
            Подтверждения гостей
        </h2>

        <table class="table table-striped">

            <thead>

            <tr>
                <th>ID</th>
                <th>ФИО</th>
                <th>Статус</th>
                <th>Дата отправки</th>
            </tr>

            </thead>

            <tbody id="guestsTable">

            </tbody>

        </table>

    </div>

</div>

<script>

async function loadGuests() {

    const response = await fetch('/api/guests');

    const guests = await response.json();

    const table = document.getElementById('guestsTable');

    table.innerHTML = '';

    guests.forEach(guest => {

        table.innerHTML += `
            <tr>
                <td>${guest.id}</td>
                <td>${guest.fullname}</td>
                <td>
                    ${guest.attendance ? '✅ Будет' : '❌ Не сможет'}
                </td>
                <td>
                    ${new Date(guest.created_at).toLocaleString('ru-RU')}
                </td>
            </tr>
        `;

    });

}

loadGuests();

</script>

</body>
</html>
